  proactiveVlmEnabled: 傳送主動觀測畫面給 VLM
  performanceProfile: 裝置運作模式
  presenceVisionMode: Presence 視覺模式
  voiceVadSettings: Silero 語音偵測
  voiceDiagnosticsEnabled: 語音診斷模式（測試用）
  conversationDiagnosticsEnabled: 對話耗時顯示（測試用）
fieldDescriptions:
  textOnlyMode: 僅對這台 Kiosk 顯示文字輸入並停用語音收音；關閉後沿用角色原本的對話設定。語音播報仍依既有設定。
  serviceMode: 新設定在下一輪訂單生效；目前測試環境的桌號隨機為 a01–a09。
  backgroundSpeechMode: 預設關閉。observe 只保存判斷；enforce 才會攔截背景談話。不影響 VAD 與操作授權。
  performanceProfile: 依硬體能力調整相機畫質、人員偵測速度與錄影上限。一般設備選「一般（建議）」；畫面卡頓時選「省資源」；高規設備才選「高規設備」。
  faceDetectionConfidence: 調低可偵測較遠或較小的人臉，但較容易誤判。預設為 0.60。
  voiceDiagnosticsEnabled: 僅測試時開啟。Kiosk 會顯示語音辨識、Speech Guard 與 turn decision 的即時結果；此資訊不會顯示給一般顧客。
  conversationDiagnosticsEnabled: 僅測試時開啟。對話區會顯示本輪從送出請求到取得最終文字與工具結果的耗時；不包含語音辨識與語音播放。
vad:
  title: Silero 語音偵測
  description: 控制何時開始錄音、何時結束一段語句，以及送往語音辨識前保留的前後音訊。
  effective: 目前生效設定：
  summary: 門檻 {threshold}、最短語音 {minSpeechDurationMs} ms、最長語音 {maxSpeechDurationS} 秒、靜音結束 {minSilenceDurationMs} ms、前後保留 {speechPadMs} ms
  fields:
    threshold: 語音門檻（VAD）
    minSpeechDurationMs: 最短語音長度（毫秒）
    maxSpeechDurationS: 最長語音長度（秒）
    minSilenceDurationMs: 靜音結束時間（毫秒）
    speechPadMs: 前後保留音訊（毫秒）
options:
  kiosk: 智慧點餐員（Kiosk）
  table-service: AI 隨桌服務員
  observe: 只記錄，不攔截
  enforce: 啟用背景音攔截
  attention: 看向 Kiosk
  presence: 進入偵測區
  mixed: 任一訊號
  off: 關閉
  snapshot: 活動觸發圖片快照
  triggered: 事件短片
  continuous: 持續錄影
  constrained: 省資源（較低畫質與較慢偵測）
  balanced: 一般（建議）
  high: 高規設備（較高畫質與較快偵測）
  face_only: 僅人臉
  pose_only: 僅姿態
  pose_plus_conditional_face: 姿態加條件式人臉注意力

localDiagnostics:
  title: 開發診斷
  description: 預設關閉，切換後立即生效並儲存在這台 Kiosk 瀏覽器；不影響人物偵測與閒置重置。
  idle: 顯示閒置重置診斷
  idleDescription: 顯示顧客接待狀態、閒置倒數與暫停重置的原因。
  presence: 顯示人物偵測診斷
  presenceDescription: 顯示 engaged 等偵測狀態、姿態品質、停留時間與偵測頻率；需啟用本機相機觀測。
  decision: 顯示決策流程
  decisionDescription: 顯示每句語音的階段、候選意圖、模型決策、操作與授權流程。

conversationMode:
  label: 實際對話模式
  text: 純文字模式
  voice: 純語音模式
  description: 請在裝置設定中調整純文字模式，儲存成功後立即套用。此處顯示裝置與角色設定共同決定的實際模式。
