title: 裝置設定
description: 設定儲存在 Server，僅影響這台設備。取消覆寫即可繼承後台或店別值。設備在線時，遠端變更會在 15 秒內同步。
override: 覆寫
effective: 目前生效值
delegate: 允許現場調整
revoke: 清除現場覆寫
locked: 後台已鎖定
save: 儲存設定
reload: 重新載入設定
saved: 設定已儲存。
failed: 無法載入或儲存設定，請確認連線與操作權限。
conflict: 其他操作人已更新設定；已保留您的草稿，請重新載入後再儲存。
login: 登入店別管理者帳號
loginRequired: 請先透過管理頁登入，再回到此處儲存。僅能修改這台設備已被授權的欄位。
fields:
  observationEnabled: 本機相機觀測
  greetingEnabled: 主動招呼
  reminderEnabled: 閒置協助提醒
  triggerMode: 招呼觸發條件
  dwellMs: 停留時間（毫秒）
  emptyResetMs: 區域清空重設時間（毫秒）
  minAttendingPeople: 最少人數
  reminderWaitMs: 提醒等待時間（毫秒）
  maxReminders: 每次互動最多提醒次數
  zoneX: 偵測區 X（0–1）
  zoneY: 偵測區 Y（0–1）
  zoneWidth: 偵測區寬度（0–1）
  zoneHeight: 偵測區高度（0–1）
  mediaCaptureMode: 相機保存方式
  faceDetectionConfidence: 人臉偵測信心（0.40–0.80）
  proactiveVlmEnabled: 傳送主動觀測畫面給 VLM
  performanceProfile: 裝置運作模式
  presenceVisionMode: Presence 視覺模式
  voiceVadSettings: Silero 語音偵測
  voiceDiagnosticsEnabled: 語音診斷模式（測試用）
  conversationDiagnosticsEnabled: 對話耗時顯示（測試用）
fieldDescriptions:
  performanceProfile: 依硬體能力調整相機畫質、人員偵測速度與錄影上限。一般設備選「一般（建議）」；畫面卡頓時選「省資源」；高規設備才選「高規設備」。
  faceDetectionConfidence: 調低可偵測較遠或較小的人臉，但較容易誤判。預設為 0.60。
  voiceDiagnosticsEnabled: 僅測試時開啟。Kiosk 會顯示語音辨識、Speech Guard 與 turn decision 的即時結果；此資訊不會顯示給一般顧客。
  conversationDiagnosticsEnabled: 僅測試時開啟。對話區會顯示本輪從送出請求到取得最終文字與工具結果的耗時；不包含語音辨識與語音播放。
vad:
  title: Silero 語音偵測
  description: 控制何時開始錄音、何時結束一段語句，以及送往語音辨識前保留的前後音訊。
  override: 覆寫店別預設設定
  effective: 目前生效設定：
  delegate: 允許現場調整整組語音偵測設定
  summary: 門檻 {threshold}、最短語音 {minSpeechDurationMs} ms、最長語音 {maxSpeechDurationS} 秒、靜音結束 {minSilenceDurationMs} ms、前後保留 {speechPadMs} ms
  fields:
    threshold: 語音門檻（VAD）
    minSpeechDurationMs: 最短語音長度（毫秒）
    maxSpeechDurationS: 最長語音長度（秒）
    minSilenceDurationMs: 靜音結束時間（毫秒）
    speechPadMs: 前後保留音訊（毫秒）
options:
  attention: 看向 Kiosk
  presence: 進入偵測區
  mixed: 任一訊號
  off: 關閉
  snapshot: 活動觸發圖片快照
  triggered: 事件短片
  continuous: 持續錄影
  constrained: 省資源（較低畫質與較慢偵測）
  balanced: 一般（建議）
  high: 高規設備（較高畫質與較快偵測）
  face_only: 僅人臉
  pose_only: 僅姿態
  pose_plus_conditional_face: 姿態加條件式人臉注意力
