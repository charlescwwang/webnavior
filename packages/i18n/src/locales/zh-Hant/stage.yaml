    editor-hint: 設定 1 至 {limit} 組，可寫入店名，每組最多 {characters} 字，依序輪播。電話頁會自動加上選填或略過說明，這裡只填開場。發布後重新載入 Kiosk，會預先準備語音；更換語音模型或聲線後也請重新載入。
    count: 目前 {count} 組，最多 {limit} 組。
    too-many: 固定歡迎詞目前有 {count} 組，最多可儲存 {limit} 組，請刪減後再儲存。
