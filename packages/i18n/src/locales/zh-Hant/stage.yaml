  slm-profile-name: '店內 SLM'
  slm-label: 'SLM（實測，OpenAI 相容）'
  slm-option: 'SLM（實測，OpenAI 相容／Docker Model Runner）'
  model-setup-hint: '選擇決策引擎與模型，再儲存並執行 readiness。SLM 只回傳單一選項，沒有推論文字或工具權限。'
  slm-base-url-hint: '填 OpenAI 相容 API 根網址；本機 Docker Model Runner 通常是 http://127.0.0.1:12434/engines/v1，不加 /chat/completions。'
  available-models: '可用模型'
  read-models: '讀取可用模型'
  discovery-hint: '從 /models 讀取可用模型；選定後的 readiness 會實際呼叫此模型。清單不代表已載入。'
  panel-description: '可選擇 Dasein open-jev、lookski/openjev 或 SLM 作為 Kiosk Fast Path。共用服務入場、需求與操作分層；SLM 只輸出單一選項。readiness 以真實決策確認部署可用，語意效果另需實測。'
  policy-description: 'Jev 與 SLM 共用分層判斷：先區分服務、招呼、背景與不確定，再判斷需求及小組操作。候選、確認、付款與 WebMCP 執行資格由程式控制；複雜需求保留整句轉交 Main Agent。'
  policy-hint: '自訂提示與店家補充套用在服務入場後的需求判斷，不會擴大第一層服務範圍或操作權限。舊自訂內容會保留；還原為系統預設後儲存，可使用目前較精簡的提示。'
