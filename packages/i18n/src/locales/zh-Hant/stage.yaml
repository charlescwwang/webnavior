    section-title: 開場招呼
    section-description: 在這裡選擇開場方式，並編輯對應的歡迎詞或 VLM 指引；切換時會保留另一種模式的內容。
    content-description: 編輯固定歡迎詞與 VLM 開場指引。店別的開場方式由有權限的管理者設定。
    mode-save-hint: 開場方式選擇後會立即儲存；台詞及指引修改需儲存並發布。重新載入 Kiosk 後套用目前設定。
    mode-fixed: 固定歡迎詞（預先準備語音）
    mode-vlm: VLM 情境生成（使用現場影像）
    vlm-description: 固定模式會預先準備歡迎詞語音；VLM 模式會傳送現場影像，依角色與開場指引生成台詞，再合成語音，需要已綁定影像模型。兩種模式的內容都會保留。此選項也決定停留提醒是否使用影像；固定模式下，停留提醒仍由對話模型生成。個別設備設定可覆寫店別預設；重新載入 Kiosk 可立即取得目前設定。
    vlm-prompt-label: VLM 開場指引
    vlm-prompt-hint: 依現場影像及此指引生成開場台詞。修改後需儲存並發布。
