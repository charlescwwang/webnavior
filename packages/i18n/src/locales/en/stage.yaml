kiosk-agent:
  retry-stale: The screen or order has changed. Please tell me what you need now.
  retry-busy: Another request is still being processed. Please try again shortly.
  context-unavailable: Menu information is unavailable. This request is unfinished; check the connection and say it again.
  service-unavailable: The menu connection was lost. New operations are paused; reconnect and check your existing order.
  service-reconnect: Reconnect menu
  service-recovered: The menu connection is restored. Earlier operations were not replayed; check your order before speaking again.
  audio-too-large: This recording exceeds the upload limit. No request was executed; please speak in shorter turns.
  audio-failed: Your speech could not be fully transcribed. No request was executed; please say it again.
  service-connecting: Connecting assistant controls. You can also use the service screen directly.
  service-manual: Assistant controls are unavailable for this service. Please use the service screen directly and check the result there.
  service-browser-unsupported: This browser does not support assistant controls. Please use the service screen directly.
  service-check-missing: This service does not provide the assistant compatibility check. Please use the service screen directly and ask staff to update it.
  service-check-failed: The browser and service did not pass the assistant compatibility check. Please use the service screen directly and ask staff to check for updates.
  control-active: The assistant is working on your order. Please wait.
  control-releasing: Waiting for the current operation to finish before returning control.
  control-manual: Use manual controls
  manual-control: Manual controls are ready. Completed changes are kept; remaining operations have stopped.
  timeout: The assistant took too long to respond. Check the screen before trying again.
  provider-error: The assistant could not reach the model or receive its reply. Please try again later.
  tool-rejected: The ordering system did not accept this operation. Check the screen before continuing.
  tool-limit: The assistant reached its processing limit. Check the completed steps on screen before continuing.
  duplicate-tool-call: The assistant requested a duplicate operation. It was stopped to avoid executing it twice. Please check the screen.
  session-error: The conversation could not be started. Please check the kiosk connection.
  no-reply: I couldn’t finish the reply this time. Please try again.
  result-unknown: The operation result is uncertain. Please check the menu, cart or order currently shown.
  reply-incomplete: This reply is incomplete. Please try again or explain your request.
  utterance-deferred: Your last request has not completed. Try again shortly, or use the screen.
  utterance-failed: Voice processing stopped. Your words have been retained. Check the cart or order before asking staff for help to avoid duplicate operations.
  voice-presence-lost: Your request was not completed because your presence in the interaction area could not be confirmed. Stand in front of the camera and try again, or use the screen.
  decision-failed: Voice processing encountered an error. Your words have been retained; please ask a staff member for help.
  decision-uncertain: I couldn’t understand your request. Please say it again.

system-one:
  slm-profile-name: 'Local SLM'
  slm-label: 'SLM (field test, OpenAI compatible)'
  slm-option: 'SLM (field test, OpenAI compatible / Docker Model Runner)'
  model-setup-hint: 'Choose an engine and model, save, then run readiness. SLM returns one choice without reasoning text or tool authority.'
  slm-base-url-hint: 'Use the OpenAI-compatible API root. Local Docker Model Runner usually uses http://127.0.0.1:12434/engines/v1 without /chat/completions.'
  available-models: 'Available models'
  read-models: 'Read available models'
  discovery-hint: 'Read available IDs from /models. Readiness calls the selected model. Discovery does not mean the model is loaded.'
  panel-description: 'Choose Dasein open-jev, lookski/openjev or SLM for Kiosk Fast Path. They share staged admission, demand and operation selection. SLM returns one choice. Readiness checks connectivity with a real decision; semantic quality requires separate testing.'
  policy-description: 'Jev and SLM first separate service, greeting, background and uncertainty, then select demand and operation groups. The application owns candidates, confirmation, payment and WebMCP authorization. Complex requests reach Main intact.'
  policy-hint: 'Custom instructions apply to demand interpretation after admission. They cannot expand service scope or operation authority. Existing custom text is preserved; restore and save the default to use the concise current policy.'
