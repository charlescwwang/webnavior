localDiagnostics:
  title: Development diagnostics
  description: Off by default. Changes apply immediately and are saved in this kiosk browser; detection and idle reset continue normally.
  idle: Show idle-reset diagnostics
  idleDescription: Shows the customer-session state, reset countdown, and reasons the reset is paused.
  presence: Show presence diagnostics
  presenceDescription: Shows presence states such as engaged, pose quality, dwell time, and detection cadence. Requires active camera observation.
  decision: Show decision flow
  decisionDescription: Shows the per-utterance phase, candidates, model decision, operation, and authorization trace.

conversationMode:
  label: Active conversation mode
  text: Text-only mode
  voice: Voice-only mode
  description: Change text-only mode in Device Settings. Successful saves apply immediately. This status reflects both device settings and the assigned Profile.
