# PB simulator: built assets and simulated orders only, separate from Kiosk/API.
location = /pb-test { return 302 /pb-test/; }
location ~ ^/(?:pb-test/|order/store/1kgJeql/internal_use/|order/(?:linepay|ecpay)/redirect/|test/orders$) {
    proxy_pass http://127.0.0.1:5198;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    client_max_body_size 1m;
}
