<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="970" viewBox="0 0 1210 970"><title>查詢／推薦的篩選條件｜細部關卡</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="PingFang TC, Noto Sans CJK TC, sans-serif" fill="#172033"><text x="40" y="48" font-size="28" font-weight="600">查詢／推薦的篩選條件｜細部關卡</text><text x="40" y="80" font-size="17" fill="#475569">所有包含／排除／飲食條件必須保留；不能因零筆結果而改查全部</text><path d="M405 220V265" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M405 415V460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M405 585V625" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M405 730V750H212V775" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M405 750H595V775" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 340H820" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 520H820" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="115" width="730" height="105" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="147" font-size="20" font-weight="600">A. Application 提供有限 references</text><text x="60" y="176" font-size="17">豬肉／蛋等：詞彙對應真實食材 ID；素食：有限 dietary ref</text><text x="60" y="201" font-size="17">程式不靠 regex 決定整句 intent 或包含／排除語意</text><rect x="40" y="265" width="730" height="150" rx="12" fill="#eee8fa" stroke="#cbd5e1"/><text x="60" y="297" font-size="20" font-weight="600">B. 同一 Jev request 的獨立選擇題</text><text x="60" y="326" font-size="17">route：SEARCH／RECOMMEND／非操作結果</text><text x="60" y="351" font-size="17">filterRequirement：COVERED／UNSUPPORTED_FILTER</text><text x="60" y="376" font-size="17">filterPresence：REQUIRED／NO_FILTER；食材：EXCLUDE／INCLUDE／NONE</text><rect x="40" y="460" width="730" height="125" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="492" font-size="20" font-weight="600">C. Server 機械式驗證答案</text><text x="60" y="521" font-size="17">條件 COVERED、slots 與 presence 一致、相關信心 ≥ 0.5</text><text x="60" y="546" font-size="17">素食 ref 存在時須選 VEGETARIAN；不確定即轉 Main Agent</text><rect x="40" y="625" width="730" height="105" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="657" font-size="20" font-weight="600">D. Application 檢查並執行交集篩選</text><text x="60" y="686" font-size="17">只接受本次提供的 ID；revision 必須一致</text><text x="60" y="711" font-size="17">素食由 POS 標示驗證，不由 Jev 推測配方</text><rect x="40" y="775" width="345" height="145" rx="12" fill="#e7f3ec" stroke="#cbd5e1"/><text x="60" y="807" font-size="20" font-weight="600">MATCHES／NONE</text><text x="60" y="836" font-size="17">MATCHES：展示符合品項</text><text x="60" y="861" font-size="17">NONE：沒有符合的餐點</text><text x="60" y="886" font-size="17">不以別的餐點補滿</text><rect x="425" y="775" width="345" height="145" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="445" y="807" font-size="20" font-weight="600">UNKNOWN／客製</text><text x="445" y="836" font-size="17">UNKNOWN：資料不足無法確認</text><text x="445" y="861" font-size="17">CUSTOMIZATION_REQUIRED：</text><text x="445" y="886" font-size="17">需客製，尚未修改或加入</text><rect x="820" y="265" width="350" height="160" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="840" y="297" font-size="20" font-weight="600">未支援／答案不確定</text><text x="840" y="326" font-size="17">保留整句 → Main Agent</text><text x="840" y="351" font-size="17">例如低鈉不能省略</text><text x="840" y="376" font-size="17">也不能改成無篩選讀取</text><rect x="820" y="465" width="350" height="145" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="840" y="497" font-size="20" font-weight="600">素食不是「沒寫肉」</text><text x="840" y="526" font-size="17">已知肉類：排除</text><text x="840" y="551" font-size="17">成分不完整：未知</text><text x="840" y="576" font-size="17">缺正向素食標示：未知</text><rect x="820" y="665" width="350" height="205" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="840" y="697" font-size="20" font-weight="600">篩選驗證結果</text><text x="840" y="726" font-size="17">有限 ID 來自本次 references</text><text x="840" y="751" font-size="17">條件由工具依 POS 資料篩選</text><text x="840" y="776" font-size="17">必要答案不完整 → Main Agent</text><text x="840" y="801" font-size="17">低信心或矛盾 → Main Agent</text><text x="840" y="826" font-size="17">不自動補任意條件</text></g></svg>
