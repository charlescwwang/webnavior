<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1260" viewBox="0 0 1240 1260"><title>Application 與 WebMCP 工具層</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="PingFang TC, Noto Sans CJK TC, sans-serif" fill="#172033"><text x="40" y="45" font-size="28" font-weight="600">Application 與 WebMCP｜兩條入口、共用業務能力</text><text x="40" y="78" font-size="17" fill="#475569">紫色：模型選擇　藍色：Application　黃色：安全分支／邊界　綠色：工具執行／結果</text><path d="M315 220V265" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M925 220V265" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M315 375V420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M925 375V420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M315 565V610" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M925 565V610" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 730V775" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M315 895V940" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M925 895V940" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="110" width="550" height="110" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="142" font-size="20" font-weight="600">Fast Path｜Kiosk host</text><text x="60" y="171" font-size="17">kiosk_fast_path_context(transcript)</text><text x="60" y="196" font-size="17">Application 發出有限語意候選、當次 state</text><rect x="650" y="110" width="550" height="110" rx="12" fill="#eee8fa" stroke="#cbd5e1"/><text x="670" y="142" font-size="20" font-weight="600">Main Agent｜對話模型</text><text x="670" y="171" font-size="17">取得業務工具 schemas，提出 tool + arguments</text><text x="670" y="196" font-size="17">看不到六個 host-only 決策工具</text><rect x="40" y="265" width="550" height="110" rx="12" fill="#eee8fa" stroke="#cbd5e1"/><text x="60" y="297" font-size="20" font-weight="600">Jev：只選 intent／有限條件</text><text x="60" y="326" font-size="17">回 candidateId；不選底層 toolName</text><text x="60" y="351" font-size="17">host 呼叫 kiosk_fast_path_execute</text><rect x="650" y="265" width="550" height="110" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="670" y="297" font-size="20" font-weight="600">native WebMCP → invokeForAgent()</text><text x="670" y="326" font-size="17">mutation 轉 operation、套安全政策</text><text x="670" y="351" font-size="17">部分 read／問題工具走各自 runtime 檢查</text><rect x="40" y="420" width="550" height="145" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="452" font-size="20" font-weight="600">Application：resolution ＋ 編譯</text><text x="60" y="481" font-size="17">resolveIntent：target／slots／歧義</text><text x="60" y="506" font-size="17">compileOperationPlan：決定 toolName / input</text><text x="60" y="531" font-size="17">authorize：phase／revision／確認／付款鎖</text><rect x="650" y="420" width="550" height="145" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="670" y="452" font-size="20" font-weight="600">Application：Agent 呼叫防護</text><text x="670" y="481" font-size="17">同名 cart lines → 釐清；高風險 → 確認</text><text x="670" y="506" font-size="17">執行前再驗授權；不接受付款安全繞過</text><text x="670" y="531" font-size="17">但不是所有 reads 都經通用 authorize</text><rect x="40" y="610" width="1160" height="120" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="60" y="642" font-size="20" font-weight="600">僅在需要時等待確認／釐清；其餘已授權操作直接執行</text><text x="60" y="671" font-size="17">唯一 target 不足 → 問真實候選；高風險 → 等有效一次性確認，consume 後才執行</text><text x="60" y="696" font-size="17">版本／TTL 不符即拒絕；Jev 不能自行指定不存在的 target 或 confirmation</text><rect x="40" y="775" width="1160" height="120" rx="12" fill="#e7f3ec" stroke="#cbd5e1"/><text x="60" y="807" font-size="20" font-weight="600">共用業務 WebMCP runtime：invoke → invokeOperation</text><text x="60" y="836" font-size="17">menu_get / menu_recommend、order_add_item、cart_*、order_*、seating_*、checkout_*</text><text x="60" y="861" font-size="17">內部 functions 更新訂單 machine、UI callbacks，必要時與 POS／付款終端互動</text><rect x="40" y="940" width="550" height="145" rx="12" fill="#e7f3ec" stroke="#cbd5e1"/><text x="60" y="972" font-size="20" font-weight="600">複合工具：order_add_item</text><text x="60" y="1001" font-size="17">selectMenuItem → setItemOption → setQuantity</text><text x="60" y="1026" font-size="17">→ addToCart → cart／selection callbacks</text><text x="60" y="1051" font-size="17">一次工具執行，不是 Jev 規劃四次工具</text><rect x="650" y="940" width="550" height="145" rx="12" fill="#e7f3ec" stroke="#cbd5e1"/><text x="670" y="972" font-size="20" font-weight="600">結果回到 Kiosk host</text><text x="670" y="1001" font-size="17">customerMessage／cart／presentation／trace</text><text x="670" y="1026" font-size="17">canonical pendingCustomerChoice</text><text x="670" y="1051" font-size="17">validate → 實際呈現 → 綁定 waitingFor</text><rect x="40" y="1125" width="1160" height="95" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="60" y="1157" font-size="20" font-weight="600">工具入口差異</text><text x="60" y="1186" font-size="17">Fast Path 驗有限條件；Main Agent reads 使用其工具參數，兩者共用成分篩選器。</text></g></svg>
