<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="1005" viewBox="0 0 1190 1005"><title>Jev 決策流程｜目前實作</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="PingFang TC, Noto Sans CJK TC, sans-serif" fill="#172033"><text x="40" y="48" font-size="28" font-weight="600">Jev 決策流程｜目前實作</text><text x="40" y="80" font-size="17" fill="#475569">藍色：Application　紫色：Jev 有限選擇　綠色：執行／回覆　黃色：非執行分支</text><path d="M400 210V245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 365V400" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 520V560" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 665V705" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 810V855" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 460H815" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 615H795V660H815" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 755H815" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="115" width="720" height="95" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="147" font-size="20" font-weight="600">1. 收到本句 ASR／文字輸入</text><text x="60" y="176" font-size="17">保留本句 ID、來源及同一 visitor session 的角色對話</text><rect x="40" y="245" width="720" height="120" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="277" font-size="20" font-weight="600">2. Application 整理當前快照</text><text x="60" y="306" font-size="17">phase、付款、selected item、cart、POS、revision</text><text x="60" y="331" font-size="17">解析真實 target／有限 slots，產生場景合法 intent</text><rect x="40" y="400" width="720" height="120" rx="12" fill="#eee8fa" stroke="#cbd5e1"/><text x="60" y="432" font-size="20" font-weight="600">3. Jev 做 bounded decision</text><text x="60" y="461" font-size="17">一般：intent ＋ 有限條件選擇；有待答問題：先判斷關係</text><text x="60" y="486" font-size="17">不看底層工具、不猜成分、不規劃工具鏈</text><rect x="40" y="560" width="720" height="105" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="592" font-size="20" font-weight="600">4. resolveIntent → compileOperationPlan</text><text x="60" y="621" font-size="17">唯一 target／完整 slots 才形成計畫</text><text x="60" y="646" font-size="17">歧義 → CLARIFICATION；能力不足 → Main Agent</text><rect x="40" y="705" width="720" height="105" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="737" font-size="20" font-weight="600">5. authorize ＋ 執行前版本檢查</text><text x="60" y="766" font-size="17">phase、target、revision、付款鎖及一次性 confirmation</text><text x="60" y="791" font-size="17">拒絕過期計畫；不偷偷重算舊計畫</text><rect x="40" y="855" width="720" height="105" rx="12" fill="#e7f3ec" stroke="#cbd5e1"/><text x="60" y="887" font-size="20" font-weight="600">6. WebMCP executor → 畫面／回覆</text><text x="60" y="916" font-size="17">只執行已授權計畫；讀取最多一次有限延續</text><text x="60" y="941" font-size="17">不循環重試新增／刪除／付款</text><rect x="815" y="400" width="330" height="185" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="835" y="432" font-size="20" font-weight="600">Jev 非操作結果</text><text x="835" y="461" font-size="17">IGNORE：不執行</text><text x="835" y="486" font-size="17">INCOMPLETE：短暫保留</text><text x="835" y="511" font-size="17">NEEDS_ASSISTANT：自動轉交</text><text x="835" y="536" font-size="17">UNAVAILABLE：不自動轉交</text><rect x="815" y="625" width="330" height="150" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="835" y="657" font-size="20" font-weight="600">Application 分支</text><text x="835" y="686" font-size="17">CLARIFICATION：一輪真實候選</text><text x="835" y="711" font-size="17">REQUIRE_CONFIRMATION：等確認</text><text x="835" y="736" font-size="17">BLOCKED：不執行</text><rect x="815" y="825" width="330" height="135" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="835" y="857" font-size="20" font-weight="600">工具回傳內容</text><text x="835" y="886" font-size="17">customerMessage / presentation</text><text x="835" y="911" font-size="17">operation plan / authorize</text><text x="835" y="936" font-size="17">cart / checkout / receipt</text></g></svg>
