<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960"><title>場景 → 提供哪些有限選項</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="PingFang TC, Noto Sans CJK TC, sans-serif" fill="#172033"><text x="40" y="48" font-size="28" font-weight="600">場景 → 提供哪些有限選項</text><text x="40" y="80" font-size="17" fill="#475569">各區為 state 的候選規則，不是先後操作順序；先由 Application 限制，再由 Jev 選擇</text><path d="M370 165H415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="105" font-size="16" fill="#475569">付款鎖／完成</text><path d="M205 215V270" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="245" font-size="16" fill="#475569">其餘依場景</text><rect x="40" y="115" width="330" height="100" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="147" font-size="20" font-weight="600">目前快照</text><text x="60" y="176" font-size="17">先驗 payment pending／uncertain</text><text x="60" y="201" font-size="17">再判 checkout 與互動 session</text><rect x="415" y="115" width="740" height="100" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="435" y="147" font-size="20" font-weight="600">payment_locked／checkout_complete</text><text x="435" y="176" font-size="17">沒有可變更的操作候選；付款未知時不重付、不取消</text><rect x="40" y="270" width="1115" height="145" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="302" font-size="20" font-weight="600">ordering｜點餐畫面</text><text x="60" y="331" font-size="17">SEARCH_MENU；無明確商品時 RECOMMEND；有推薦批次時 RECOMMEND_MORE</text><text x="60" y="356" font-size="17">命中商品 → SELECT_ITEM；有商品／焦點／最近加入 → ADD_ITEM</text><text x="60" y="381" font-size="17">有 selected／cart → 改數量／選項；有 cart → 查看／刪除／清空／用餐方式</text><rect x="40" y="455" width="535" height="140" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="60" y="487" font-size="20" font-weight="600">checkout_membership／invoice</text><text x="60" y="516" font-size="17">會員：SKIP_MEMBERSHIP、CANCEL</text><text x="60" y="541" font-size="17">發票：捐贈、統編、CANCEL</text><text x="60" y="566" font-size="17">已有載具才提供使用載具</text><rect x="620" y="455" width="535" height="140" rx="12" fill="#e8f0fc" stroke="#cbd5e1"/><text x="640" y="487" font-size="20" font-weight="600">checkout_tax_id／payment_select</text><text x="640" y="516" font-size="17">統編：合法八位 SET；畫面有效才 CONFIRM</text><text x="640" y="541" font-size="17">付款：card、mobile、CANCEL</text><text x="640" y="566" font-size="17">選付款 ≠ 立即啟動付款</text><rect x="40" y="635" width="535" height="145" rx="12" fill="#eee8fa" stroke="#cbd5e1"/><text x="60" y="667" font-size="20" font-weight="600">有待答的操作問題</text><text x="60" y="696" font-size="17">Jev：是否任務語句 → 回答或新需求</text><text x="60" y="721" font-size="17">回答：縮限到該問題 choices</text><text x="60" y="746" font-size="17">新需求：解除舊問題的回答權限</text><rect x="620" y="635" width="535" height="145" rx="12" fill="#fff1d6" stroke="#cbd5e1"/><text x="640" y="667" font-size="20" font-weight="600">clarification／pending_confirmation</text><text x="640" y="696" font-size="17">釐清：原 intent ＋ 真實有限 refs</text><text x="640" y="721" font-size="17">確認：具體 action／payload／ID／版本</text><text x="640" y="746" font-size="17">不得把「好」當成任意操作授權</text><rect x="40" y="825" width="1115" height="95" rx="12" fill="#e7f3ec" stroke="#cbd5e1"/><text x="60" y="857" font-size="20" font-weight="600">所有 mutation 都再驗證；有候選不等於可立即執行</text><text x="60" y="886" font-size="17">例如兩筆水餃仍保留 REMOVE_ITEM，但必須釐清唯一 cart line；內用桌位就緒才可結帳。</text></g></svg>
